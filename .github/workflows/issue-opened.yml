name: 'Label Issues'

on:
  issues:
    types: ['opened', 'reopened']

jobs:
  label_issues:
    # The roadmap App opens issues for the public roadmap. These issues do not need triage.
    if: github.event.issue.user.login != 'documenso-roadmap-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["status: triage"]
            })
