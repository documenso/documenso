name: Playwright Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build App'
    timeout-minutes: 20
    runs-on: warp-ubuntu-2204-x64-8x
    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - name: Build app
        run: npm run build -w @documenso/remix

      - uses: actions/upload-artifact@v4
        with:
          name: remix-build
          path: apps/remix/build
          retention-days: 1
          if-no-files-found: error

  e2e_tests:
    name: 'E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})'
    timeout-minutes: 30
    runs-on: warp-ubuntu-2204-x64-8x
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - name: Start Services
        run: npm run dx:up

      - uses: ./.github/actions/playwright-install

      - uses: actions/download-artifact@v4
        with:
          name: remix-build
          path: apps/remix/build

      - name: Create the database
        run: npm run prisma:migrate-dev

      - name: Seed the database
        run: npm run prisma:seed

      - name: Run Playwright tests
        run: npm run test:e2e -w @documenso/app-tests
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Needed since we use next start which will set the NODE_ENV to production
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7

  # Single required check for branch protection; shard jobs come and go as the matrix changes.
  e2e_tests_result:
    name: 'E2E Tests'
    if: always()
    needs: e2e_tests
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.e2e_tests.result }}" != "success" ]; then
            echo "One or more E2E shards failed: ${{ needs.e2e_tests.result }}"
            exit 1
          fi
